$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://cristos.dev/swain/event-spec.schema.v2.yaml"
title: Event Contract Spec
description: >-
  A machine-checkable specification for a cross-context domain event.
type: object
additionalProperties: false
required:
  - event
  - version
  - producer
  - owner
  - consumers
  - payload
properties:
  event:
    type: string
    pattern: "^[A-Z][a-zA-Z0-9]+(-[A-Z][a-zA-Z0-9]+)*$"
    description: PascalCase event name, optionally hyphenated for compounds.
  version:
    type: integer
    minimum: 1
    description: Monotonically increasing event version.
  producer:
    type: string
    description: Name of the bounded context that produces the event.
  owner:
    type: string
    description: Team or bounded context accountable for the contract.
  consumers:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
  payload:
    type: object
    minProperties: 1
    description: Scalar-shorthand map of field name to type token.
    additionalProperties:
      type: string
      enum:
        - string
        - integer
        - number
        - boolean
        - array
        - object
  description:
    type: string
    description: When this event fires.
  since:
    type: integer
    minimum: 1
    description: Version in which this event was introduced.
  deprecated:
    type: integer
    minimum: 1
    description: Version in which this event was deprecated (not yet removed).
